# Risk marks for surveys.capnp (stage 1, provisional; they move into the contract as annotations later).
# A method or union member without an entry counts as `unknown` and is listed by the tests.

[Credential]
none = "acts-in-name"
open = "acts-in-name"
person = "acts-in-name"
proof = { risk = "excluded", reason = "Data proof: free-form content nobody has judged (answer to Respond.challenge)" }
token = { risk = "excluded", reason = "a token is a secret (ADR 0021)" }

[Decisions]
get = "read"
linkTask = "change"
list = "read"
ofTask = "read"
record = "acts-in-name"
unlinkTask = "destructive"

[Designer]
createBy = "acts-in-name"
setAiAllowed = { risk = "excluded", reason = "decides whether AIs may answer: only the creator, a human, may allow it; an agent never does (ADR 0054)" }
addQuestion = "add"
archive = "change"
classify = { risk = "excluded", reason = "sets ADR 0029 categories: the person decides what is protected" }
close = "change"
create = "add"
delete = "destructive"
edit = "change"
editQuestion = "change"
get = "read"
invite = { risk = "excluded", reason = "an invitation to answer: no tool for invitations until the strategy decides (question noted in DESIGN.md)" }
list = "read"
moveQuestion = "change"
publish = "acts-in-name"
removeQuestion = "destructive"
reopen = "change"
setConditions = "change"
widen = "acts-in-name"

[Respond]
challenge = "read"
open = "read"
resume = "read"
save = "acts-in-name"
submit = "acts-in-name"
voluntary = "acts-in-name"

[Results]
exportAi = "read"
evaluate = "read"
export = "read"
filter = "read"
summary = "read"

[Surveys]
capabilities = "read"
decisions = "read"
designer = "read"
respond = "read"
results = "read"
subscribe = "read"
supportReport = "read"

[release]
"InviteReport.already" = "a list of people invited before; the comment only says that no new token is sent"

[format]
"Decision.as2" = "AS2 JSON (a specialist format, not a secret field; it can still hold what a person wrote)"
"Survey.as2" = "AS2 JSON (a specialist format, not a secret field; it can still hold what a person wrote)"
"Answer.text" = "display text (plain text); a specialist or display format, not a secret field; it can still hold what a person wrote"
"Condition.value" = "condition value (plain text); a specialist or display format, not a secret field; it can still hold what a person wrote"
"Decision.note" = "note text (plain text); a specialist or display format, not a secret field; it can still hold what a person wrote"
