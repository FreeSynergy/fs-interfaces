# Risk marks for streaming.capnp (stage 1, provisional; they move into the contract as annotations later).
# A method or union member without an entry counts as `unknown` and is listed by the tests.

[Streaming]
capabilities = "read"
streams = "read"
subscribe = "read"
supportReport = "read"

[Streams]
addTarget = { risk = "excluded", reason = "takes or returns a key that is a secret (streaming.capnp header, ADR 0021)" }
check = "acts-in-name"
create = { risk = "excluded", reason = "takes or returns a key that is a secret (streaming.capnp header, ADR 0021)" }
delete = "destructive"
editTarget = "acts-in-name"
get = "read"
list = "read"
removeTarget = "destructive"
rename = "change"
rotateKey = { risk = "excluded", reason = "takes or returns a key that is a secret (streaming.capnp header, ADR 0021)" }
setRecording = "acts-in-name"
setTargetEnabled = "change"
setTargetKey = { risk = "excluded", reason = "takes or returns a key that is a secret (streaming.capnp header, ADR 0021)" }
status = "read"
stop = "change"
targets = "read"

[release]
"CheckResult.key" = "only the verdict of the check (KeyCheck), not the key"
"Target.hasKey" = "only says whether a key is set; the key itself is never read back (streaming.capnp header)"
"Streams" = "the comment of the interface speaks of the key because of rotateKey; every method that takes or returns a key is excluded on its own"
"Stream.ingestUrl" = "the comment says the key is NOT part of the url"
"Target.url" = "the comment says: never the key"
"CheckResult.note" = "the comment says only that the note tells in words if a key travelled readable; the key is not in it"
"Streams.editTarget" = "the compiler attaches the comment of the next declaration here; it mentions the key only in words, and this method takes no key"
"Streams.status" = "the compiler attaches the comment of the next declaration here; it mentions rotateKey only in words"
"Target.secure" = "a bool (rtmps or not); the comment only says that a key would travel readable on plain rtmp"
"Target.note" = "the comment says: the last problem, with no key in it"
