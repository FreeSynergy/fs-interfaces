# Risk marks for groups.capnp (stage 1, provisional; they move into the contract as annotations later).
# A method or union member without an entry counts as `unknown` and is listed by the tests.

[Delegations]
"@interface" = { risk = "excluded", reason = "administration of rights, roles, memberships, sharing or storage: an agent is never admin (ADR 0056); reads here are left out too" }

[GroupDirectory]
"@interface" = { risk = "excluded", reason = "provider or mirror interface (identity mirror, storage, tiles, hub protocol), not a capability of a person (ADR 0045, 0047, 0056)" }


[Groups]
delegations = "read"
invitations = "read"
items = "read"
memberships = "read"
subscribe = "read"
supportReport = "read"

[Invitations]
"@interface" = { risk = "excluded", reason = "administration of rights, roles, memberships, sharing or storage: an agent is never admin (ADR 0056); reads here are left out too" }

[Items]
addParent = { risk = "excluded", reason = "changes how rights flow between groups: administration (ADR 0056)" }
ancestors = "read"
approveParent = { risk = "excluded", reason = "may grant rights or an admin role; an agent is never admin (ADR 0056)" }
children = "read"
create = "acts-in-name"
declineParent = { risk = "excluded", reason = "may grant rights or an admin role; an agent is never admin (ADR 0056)" }
delete = "destructive"
descendants = "read"
get = "read"
list = "read"
parentRequests = "read"
parents = "read"
removeParent = { risk = "excluded", reason = "changes how rights flow between groups: administration (ADR 0056)" }
rename = "change"
requestParent = "acts-in-name"
setKind = "change"
setRightFlow = { risk = "excluded", reason = "may grant rights or an admin role; an agent is never admin (ADR 0056)" }

[Memberships]
"@interface" = { risk = "excluded", reason = "administration of rights, roles, memberships, sharing or storage: an agent is never admin (ADR 0056); reads here are left out too" }
