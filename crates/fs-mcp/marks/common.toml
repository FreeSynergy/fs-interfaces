# Risk marks for common.capnp (stage 1, provisional; they move into the contract as annotations later).
# A method or union member without an entry counts as `unknown` and is listed by the tests.

[Blob]
read = { risk = "read", resource = true }
size = "read"

[release]
"Cursor.opaque" = "an opaque paging cursor that the program itself issues: it holds a position, never a secret (common.capnp)"
"Blob.read.data" = "bytes of a file or attachment; whether they are sensitive (ADR 0029) is decided by the engine at the object, and every read needs a release anyway (ADR 0054)"
"Problem.status" = "the compiler attaches the comment about the keys of extension members here; the field is an HTTP status"
"Cursor" = "the compiler attaches the comment of the next declaration (an extension member with a key) to the Cursor; the Cursor holds a position"
"Extension.key" = "the name of an RFC 9457 extension member, not key material"

[format]
"Extension.value" = "problem extension value (plain text); a specialist or display format, not a secret field; it can still hold what a person wrote"
"Problem.detail" = "problem detail (plain text, RFC 9457); a specialist or display format, not a secret field; it can still hold what a person wrote"
