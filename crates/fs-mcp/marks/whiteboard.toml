# Risk marks for whiteboard.capnp (stage 1, provisional; they move into the contract as annotations later).
# A method or union member without an entry counts as `unknown` and is listed by the tests.

[BoardEditor]
add = { risk = "excluded", reason = "takes an element with a full Envelope (sensitive, to, bcc; ADR 0029) that the generator cannot restrict" }
addPage = "add"
align = "change"
bounds = "read"
copy = "add"
delete = "destructive"
elements = "read"
export = "read"
get = "read"
getElement = "read"
group = "change"
move = "change"
movePage = "change"
redo = "change"
removePage = "destructive"
reorder = "change"
rotate = "change"
setEnd = "change"
setFrame = "change"
setLocked = "change"
setParent = "change"
setStyle = "change"
setText = "change"
undo = "change"
ungroup = "change"

[Boards]
create = "add"
delete = "destructive"
import = "add"
list = "read"
open = "read"
rename = "change"

[Whiteboard]
boards = "read"
capabilities = "read"
subscribe = "read"
supportReport = "read"

[format]
"Board.as2" = "AS2 JSON (a specialist format, not a secret field; it can still hold what a person wrote)"
"BoardEditor.setText.text" = "display text (plain text); a specialist or display format, not a secret field; it can still hold what a person wrote"
"Element.note" = "note text (plain text); a specialist or display format, not a secret field; it can still hold what a person wrote"
"Element.text" = "display text (plain text); a specialist or display format, not a secret field; it can still hold what a person wrote"
