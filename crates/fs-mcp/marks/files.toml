# Risk marks for files.capnp (stage 1, provisional; they move into the contract as annotations later).
# A method or union member without an entry counts as `unknown` and is listed by the tests.

[Backends]
"@interface" = { risk = "excluded", reason = "administration of rights, roles, memberships, sharing or storage: an agent is never admin (ADR 0056); reads here are left out too" }

[BlobBackend]
"@interface" = { risk = "excluded", reason = "provider or mirror interface (identity mirror, storage, tiles, hub protocol), not a capability of a person (ADR 0045, 0047, 0056)" }


[Files]
backends = "read"
folders = "read"
search = "read"
sharing = "read"
types = "read"
subscribe = "read"
supportReport = "read"
transfer = "read"

[Folders]
classify = { risk = "excluded", reason = "sets ADR 0029 categories: the person decides what is protected" }
copyFile = "add"
createFolder = "add"
deleteFolder = "destructive"
emptyTrash = "destructive"
get = "read"
getFolder = "read"
list = "read"
moveFile = "change"
moveFolder = "change"
purge = "destructive"
renameFile = "change"
renameFolder = "change"
rescan = "change"
restore = "change"
restoreTo = "change"
trash = "destructive"

[Search]
find = "read"

[Sharing]
"@interface" = { risk = "excluded", reason = "sharing rights: administration, an agent is never admin (ADR 0056); a placeholder today, closed for the methods it will get" }

[Transfer]
open = "read"
pendingUploads = "read"
resumeUpload = "add"
startUpload = "add"

[Upload]
abort = "destructive"
finish = "add"
received = "read"
write = "add"
