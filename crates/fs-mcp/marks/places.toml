# Risk marks for places.capnp (stage 1, provisional; they move into the contract as annotations later).
# A method or union member without an entry counts as `unknown` and is listed by the tests.

[Places]
create = "add"
delete = "destructive"
findByName = "read"
get = "read"
list = "read"
subscribe = "read"
supportReport = "read"
tiles = "read"
types = "read"
update = "change"
within = "read"

[TileSource]
"@interface" = { risk = "excluded", reason = "provider or mirror interface (identity mirror, storage, tiles, hub protocol), not a capability of a person (ADR 0045, 0047, 0056)" }

[format]
"Place.geojson" = "GeoJSON (a specialist format, not a secret field; it can still hold what a person wrote)"
"Places.create.geojson" = "GeoJSON (a specialist format, not a secret field; it can still hold what a person wrote)"
"Places.update.geojson" = "GeoJSON (a specialist format, not a secret field; it can still hold what a person wrote)"
