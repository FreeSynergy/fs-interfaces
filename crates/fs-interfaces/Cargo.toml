[package]
name = "fs-interfaces"
description = "FreeSynergy interface contracts: Cap'n Proto schemas (one owner per topic, draft until 1.0) with committed generated Rust, and the shared provider rule (Unsupported, Capabilities)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[features]
# The shared server and client side of every contract: Unix socket, RPC system, envelope on the wire,
# RFC 9457 problems as RPC errors, pages, change feed. Pulls in the runtime; contracts alone do not.
rpc = ["dep:capnp-rpc", "dep:tokio", "dep:tokio-util", "dep:futures", "dep:fs-store", "dep:chrono", "dep:uuid", "dep:rustix"]

[dependencies]
capnp = "0.27"
capnp-rpc = { version = "0.27", optional = true }
tokio = { version = "1", features = ["rt", "net", "sync", "macros", "signal", "time"], optional = true }
tokio-util = { version = "0.7", features = ["compat", "rt"], optional = true }
futures = { version = "0.3", optional = true }
fs-store = { git = "https://github.com/FreeSynergy/fs-store", tag = "v0.4.0", optional = true }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"], optional = true }
uuid = { version = "1", optional = true }
rustix = { version = "1", features = ["process"], optional = true }

[dev-dependencies]
# Our own pure-Rust schema compiler (ADR 0040) regenerates the committed code ...
capnp-compiler = { git = "https://github.com/FreeSynergy/fs-capnpc", tag = "v0.1.0" }
capnpc = "0.27"
# ... and the official compiler (as WASM) is the oracle in tests/generated_matches_official.rs.
capnpc-embedded = "0.2"
tempfile = "3"
tokio = { version = "1", features = ["rt", "net", "sync", "macros", "signal", "time"] }
